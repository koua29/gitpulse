<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitPulse — koua29</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --ink:#e6edf3;
    --muted:#8b949e; --pink:#f778ba; --violet:#a371f7; --blue:#58a6ff;
    --green:#3fb950; --amber:#d29922;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 18px 60px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:26px;margin:0;font-weight:700}
  h1 .pulse{color:var(--pink)}
  .sub{color:var(--muted);font-size:13px}
  .kpis{display:grid;gap:12px;grid-template-columns:repeat(5,1fr);margin:22px 0}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .kpi .n{font-size:24px;font-weight:700}
  .kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .grid{display:grid;gap:16px;grid-template-columns:1fr 1fr}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .card h2{margin:0 0 12px;font-size:15px;font-weight:600;color:var(--ink)}
  .full{grid-column:1/-1}
  canvas{max-height:280px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  a{color:var(--blue);text-decoration:none}
  a:hover{text-decoration:underline}
  .tag{font-size:10px;color:var(--amber);border:1px solid var(--amber);
    border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:middle}
  footer{color:var(--muted);font-size:12px;margin-top:26px;text-align:center}
  @media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Git<span class="pulse">Pulse</span></h1>
    <span class="sub" id="who">loading…</span>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="card full"><h2>Views &amp; unique visitors</h2><canvas id="traffic"></canvas></div>
    <div class="card full"><h2>Clones</h2><canvas id="clones"></canvas></div>
    <div class="card"><h2>Stars over time</h2><canvas id="stars"></canvas></div>
    <div class="card"><h2>Top referrers</h2>
      <table><thead><tr><th>Source</th><th class="n">Views</th><th class="n">Uniq.</th></tr></thead>
      <tbody id="refs"></tbody></table></div>
    <div class="card full"><h2>Repos ranked by views (14d)</h2>
      <table><thead><tr><th>Repo</th><th class="n">Views</th><th class="n">★</th><th class="n">Forks</th></tr></thead>
      <tbody id="rank"></tbody></table></div>
  </div>

  <footer id="foot"></footer>
</div>

<script>
const C = getComputedStyle(document.documentElement);
const col = n => C.getPropertyValue(n).trim();
Chart.defaults.color = col('--muted');
Chart.defaults.borderColor = col('--border');
Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;

function line(id, labels, sets){
  new Chart(document.getElementById(id), {
    type:'line',
    data:{labels, datasets:sets.map(s=>({
      label:s.label, data:s.data, borderColor:s.c,
      backgroundColor:s.c+'22', fill:true, tension:.3,
      pointRadius:0, borderWidth:2}))},
    options:{responsive:true, interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:sets.length>1,labels:{boxWidth:12}}},
      scales:{x:{grid:{display:false}},y:{beginAtZero:true}}}
  });
}
function esc(s){return (s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}

fetch('dashboard.json?_=' + Date.now()).then(r=>r.json()).then(d=>{
  document.getElementById('who').textContent =
    '@' + d.user + ' · updated ' + d.generated.slice(0,16).replace('T',' ') + ' UTC';

  const K = d.kpi;
  const cards = [
    ['Views 14d', K.views14, '--pink'], ['Stars', K.stars, '--amber'],
    ['Forks', K.forks, '--violet'], ['Followers', K.followers, '--blue'],
    ['Repos', K.repos, '--green']];
  document.getElementById('kpis').innerHTML = cards.map(([l,n,c])=>
    `<div class="kpi"><div class="n" style="color:${col(c)}">${n}</div><div class="l">${l}</div></div>`).join('');

  const s = d.series, lab = s.map(x=>x.date.slice(5));
  line('traffic', lab, [
    {label:'Views', data:s.map(x=>x.views), c:col('--pink')},
    {label:'Unique', data:s.map(x=>x.view_uniques), c:col('--violet')}]);
  line('clones', lab, [
    {label:'Clones', data:s.map(x=>x.clones), c:col('--blue')},
    {label:'Unique', data:s.map(x=>x.clone_uniques), c:col('--green')}]);

  const ss = d.stars_series;
  line('stars', ss.map(x=>x.date.slice(5)),
    [{label:'Stars', data:ss.map(x=>x.total_stars), c:col('--amber')}]);

  document.getElementById('refs').innerHTML = (d.referrers.length?d.referrers:[])
    .map(r=>`<tr><td>${esc(r.referrer)}</td><td class="n">${r.count}</td><td class="n">${r.uniques}</td></tr>`)
    .join('') || '<tr><td colspan="3" style="color:var(--muted)">No referrer data yet</td></tr>';

  document.getElementById('rank').innerHTML = d.ranking.map(r=>
    `<tr><td><a href="${r.url}" target="_blank">${esc(r.name)}</a>${r.private?'<span class="tag">private</span>':''}</td>`+
    `<td class="n">${r.views14}</td><td class="n">${r.stars}</td><td class="n">${r.forks}</td></tr>`).join('');

  document.getElementById('foot').textContent =
    'GitPulse — self-hosted GitHub stats · data collected daily via GitHub Actions';
}).catch(e=>{
  document.getElementById('who').textContent = 'no data yet — run the collector once';
});
</script>
</body>
</html>
