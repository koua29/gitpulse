name: GitPulse collect

on:
  schedule:
    - cron: '17 6 * * *'   # every day 06:17 UTC
  workflow_dispatch: {}      # manual "Run workflow" button

permissions:
  contents: write            # allow committing snapshots back

concurrency:
  group: gitpulse
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # GH_USER is derived from whoever owns this repo, so a fork needs
      # zero code edits — just add the GITPULSE_TOKEN secret.
      - name: Collect stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITPULSE_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python collect.py

      # Optional: refresh the badge in the {owner}/{owner} profile README.
      # Silently skips if that repo has no README.
      - name: Refresh profile README badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITPULSE_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python update_profile.py

      - name: Commit snapshot
        run: |
          git config user.name  "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner }}@users.noreply.github.com"
          git add data docs/dashboard.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: daily snapshot $(date -u +%F)"
            git push
          fi
