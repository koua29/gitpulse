name: GitPulse collect

on:
  schedule:
    - cron: '17 6 * * *'   # every day 06:17 UTC
  workflow_dispatch: {}      # manual "Run workflow" button

permissions:
  contents: write            # allow committing snapshots back

concurrency:
  group: gitpulse
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITPULSE_TOKEN }}
          GH_USER: koua29
        run: python collect.py

      - name: Refresh profile README badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITPULSE_TOKEN }}
          GH_USER: koua29
        run: python update_profile.py

      - name: Commit snapshot
        run: |
          git config user.name  "koua29"
          git config user.email "24193002+koua29@users.noreply.github.com"
          git add data docs/dashboard.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: daily snapshot $(date -u +%F)"
            git push
          fi
